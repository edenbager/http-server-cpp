name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server
        run: g++ -std=c++17 -O2 WebServer.cpp -o webserver
      - name: Run the end-to-end tests
        run: |
          ./webserver www &
          sleep 1
          python3 tests/test_server.py
